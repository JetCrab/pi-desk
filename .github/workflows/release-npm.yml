name: Release npm

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      packages:
        type: string
        required: true
      phase:
        type: string
        default: all
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref_name }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  NPM_ARTIFACT_DIR: ${{ github.workspace }}/temp/package/npm-release/${{ github.run_id }}-${{ github.run_attempt }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 核对固定源码、包列表和执行阶段
        id: selection
        env:
          CALL_PACKAGES: ${{ inputs.packages }}
          CALL_PHASE: ${{ inputs.phase }}
          CALL_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFileSync } from 'node:fs'
          assert.ok(['refs/heads/main', 'refs/heads/dev'].includes(process.env.GITHUB_REF))
          assert.match(process.env.CALL_SHA, /^[a-f0-9]{40}$/)
          assert.ok(['build', 'publish', 'all'].includes(process.env.CALL_PHASE))
          const packages = JSON.parse(process.env.CALL_PACKAGES)
          assert.ok(Array.isArray(packages) && packages.every(name => /^pi-desk(?:-[a-z0-9-]+)?$/.test(name)))
          assert.equal(new Set(packages).size, packages.length)
          appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(packages)}\n`)
          JS

  build:
    needs: plan
    if: needs.plan.outputs.packages != '[]' && inputs.phase != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_PACKAGES_JSON: ${{ needs.plan.outputs.packages }}
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/tsconfig.json
      PI_CODING_AGENT_DIR: ${{ github.workspace }}/temp/pi/npm-ci/${{ github.run_id }}-${{ github.run_attempt }}/agent
      PI_CODING_AGENT_SESSION_DIR: ${{ github.workspace }}/temp/pi/npm-ci/${{ github.run_id }}-${{ github.run_attempt }}/agent/sessions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/dev'
        with:
          name: dev-manifests-${{ github.run_id }}
          path: .
      - name: 安装公开依赖
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: 复用 dev npm 包缓存
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache@v4
        with:
          path: temp/cache/npm-release/_cacache
          key: ${{ runner.os }}-npm-dev-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-npm-dev-
      - name: 复用 dev Next 构建缓存
        if: github.ref == 'refs/heads/dev' && contains(fromJSON(needs.plan.outputs.packages), 'pi-desk')
        uses: actions/cache@v4
        with:
          path: temp/cache/next/npm-dev
          key: ${{ runner.os }}-next-npm-dev-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-npm-dev-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-npm-dev-
      - name: 并行构建、检查并打包独立 npm 单元
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/temp/cache/npm-release
        run: node .github/scripts/release-npm.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ github.run_id }}
          overwrite: true
          path: ${{ env.NPM_ARTIFACT_DIR }}/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON(needs.plan.outputs.packages), 'pi-desk')
        with:
          name: npm-command-smoke-${{ github.run_id }}
          overwrite: true
          path: ${{ env.NPM_ARTIFACT_DIR }}/command-smoke/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: 保留 npm 构建失败现场
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-build-failure-${{ github.run_id }}
          overwrite: true
          path: |
            temp/run/npm-release/
            temp/pi/npm-release/
          if-no-files-found: ignore
          retention-days: 7

  installed-commands:
    needs: [plan, build]
    if: inputs.phase != 'publish' && contains(fromJSON(needs.plan.outputs.packages), 'pi-desk')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/dev'
        with:
          name: dev-manifests-${{ github.run_id }}
          path: .
      - name: 核对并固定 Windows Git Bash
        if: runner.os == 'Windows'
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $gitBin = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git for Windows 未提供 Bash' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$gitBin;$env:PATH"
          & (Join-Path $gitBin 'bash.exe') -c 'node -p process.platform'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装公开依赖
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-command-smoke-${{ github.run_id }}
          path: ${{ env.NPM_ARTIFACT_DIR }}/command-smoke
      - name: Windows 核心回归复用同批 SDK 产物
        if: runner.os == 'Windows' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { basename, dirname, resolve } from 'node:path'
          import { run } from './.github/scripts/release-npm.mjs'
          const sdk = resolve(process.env.NPM_ARTIFACT_DIR, 'command-smoke/sdk.tgz')
          run('tar.exe', ['-xzf', basename(sdk), '--strip-components=1', '-C', resolve('plugins/pi-desk-sdk')], { cwd: dirname(sdk) })
          NODE
          pnpm test:pidesk
      - name: 验收同一批实际 tarball 的安装态命令
        shell: bash
        run: node .github/scripts/verify-npm-install.mjs "$NPM_ARTIFACT_DIR/command-smoke/sdk.tgz" "$NPM_ARTIFACT_DIR/command-smoke/host.tgz"
      - name: 保留安装态验收失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-failure-${{ matrix.os }}-${{ github.run_id }}
          overwrite: true
          path: |
            temp/run/npm-release/
            temp/pi/npm-release/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.packages != '[]' &&
      ((inputs.source_sha && inputs.phase == 'publish') ||
       (inputs.phase == 'all' && needs.build.result == 'success' &&
        (!contains(fromJSON(needs.plan.outputs.packages), 'pi-desk') || needs.installed-commands.result == 'success')))
    needs: [plan, build, installed-commands]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_PACKAGES_JSON: ${{ needs.plan.outputs.packages }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/dev'
        with:
          name: dev-manifests-${{ github.run_id }}
          path: .
      - name: 准备可信发布所需 npm
        run: npm install --global npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages-${{ github.run_id }}
          path: ${{ env.NPM_ARTIFACT_DIR }}
      - name: 发布同一批已验证制品
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_RESUME: ${{ (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/dev' && github.run_attempt > 1)) && 'true' || 'false' }}
        run: node .github/scripts/release-npm.mjs publish
