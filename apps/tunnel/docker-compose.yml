services:
  pi-desk-tunnel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PI_DESK_TUNNEL_IMAGE:-pi-desk-tunnel:local}
    restart: always
    network_mode: host
    stop_grace_period: 30s
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PI_DESK_TUNNEL_SERVER_KEY: ${PI_DESK_TUNNEL_SERVER_KEY:-}
    volumes:
      - tunnel-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  tunnel-data:
