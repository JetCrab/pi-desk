name: Release dev
run-name: 开发验证与构建 · ${{ github.sha }}

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: 手动构建目标
        type: choice
        options: [all, npm, windows, macos, linux, android, ios, tunnel]
        default: all
      publish:
        description: 将验证通过的 npm 开发包发布到 dev 标签
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# 每个提交独立登记，避免 GitHub 并发组替换第三个待运行批次。
concurrency:
  group: release-dev-${{ github.run_id }}
  cancel-in-progress: false

env:
  RELEASE_BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
  DEV_MANIFEST_DIR: ${{ github.workspace }}/temp/build/dev-manifests/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 等待前批次结束，不取消连续提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-queue.mjs

  plan:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      check_base: ${{ steps.plan.outputs.check_base }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      tunnel: ${{ steps.plan.outputs.tunnel }}
      desktop_checks: ${{ steps.plan.outputs.desktop_checks }}
      android_checks: ${{ steps.plan.outputs.android_checks }}
      tunnel_checks: ${{ steps.plan.outputs.tunnel_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: 按成功版本选择范围并固定本批开发版本
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: node .github/scripts/release-dev.mjs prepare
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.packages != '[]'
        with:
          name: dev-manifests-${{ github.run_id }}
          overwrite: true
          path: ${{ env.DEV_MANIFEST_DIR }}/
          retention-days: 7
          if-no-files-found: error

  checks:
    needs: plan
    uses: ./.github/workflows/check.yml
    with:
      source_sha: ${{ github.sha }}
      base_sha: ${{ needs.plan.outputs.check_base }}
      built_packages: ${{ needs.plan.outputs.packages }}

  npm-build:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      source_sha: ${{ github.sha }}
      packages: ${{ needs.plan.outputs.packages }}
      phase: build

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true' || needs.plan.outputs.desktop_checks == 'true'
    uses: ./.github/workflows/build-clients.yml
    with:
      source_sha: ${{ github.sha }}
      platform: windows
      distribute: false
      check_only: ${{ needs.plan.outputs.windows != 'true' }}

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    uses: ./.github/workflows/release-apple.yml
    with:
      source_sha: ${{ github.sha }}
      platform: macos

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true' || needs.plan.outputs.desktop_checks == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      source_sha: ${{ github.sha }}
      check_only: ${{ needs.plan.outputs.linux != 'true' }}

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true' || needs.plan.outputs.android_checks == 'true'
    uses: ./.github/workflows/build-clients.yml
    with:
      source_sha: ${{ github.sha }}
      platform: android
      distribute: false
      check_only: ${{ needs.plan.outputs.android != 'true' }}

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/release-apple.yml
    with:
      source_sha: ${{ github.sha }}
      platform: ios

  tunnel:
    needs: plan
    if: needs.plan.outputs.tunnel == 'true' || needs.plan.outputs.tunnel_checks == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-tunnel.yml
    with:
      source_sha: ${{ github.sha }}
      phase: build
      check_only: ${{ needs.plan.outputs.tunnel != 'true' }}

  npm-artifacts:
    needs: [plan, npm-build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 确认本批原始制品已完整上传
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES_JSON: ${{ needs.plan.outputs.packages }}
        run: node .github/scripts/reuse-npm-artifacts.mjs
      - name: 阻止原始制品缺失的发布
        if: needs.npm-build.result == 'success' && steps.artifacts.outputs.reusable != 'true'
        run: |
          echo '构建成功但缺少完整原始制品，停止发布以免无法续跑。' >&2
          exit 1
      - name: 保存可续跑的原始制品来源
        if: steps.artifacts.outputs.reusable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-dev-reuse.mjs record

  npm-publish:
    needs: [plan, checks, npm-build, npm-artifacts]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.packages != '[]' && needs.checks.result == 'success' &&
      needs.npm-build.result == 'success' && needs.npm-artifacts.result == 'success' && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      source_sha: ${{ github.sha }}
      packages: ${{ needs.plan.outputs.packages }}
      phase: publish
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  result:
    needs:
      [
        plan,
        checks,
        npm-build,
        npm-artifacts,
        windows,
        macos,
        linux,
        android,
        ios,
        tunnel,
        npm-publish
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 保存实际成功单元，失败范围留待后续批次
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/release-dev.mjs complete
