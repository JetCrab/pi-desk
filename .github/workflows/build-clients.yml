name: Build clients

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定构建源码提交（完整 SHA）
        type: string
        required: true
      platform:
        description: 构建平台（all/windows/android）
        type: string
        default: all
      distribute:
        description: 要求 Android 使用正式签名，不执行发布或上传
        type: boolean
        default: false
      check_only:
        description: 仅执行受影响检查，不生成安装包
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: build-clients-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 核对分支、平台和源码 SHA
        env:
          RELEASE_REF: ${{ github.ref }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          DISTRIBUTE: ${{ inputs.distribute }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/heads/main &&
                ( "$RELEASE_REF" != refs/heads/dev || -z "$REQUESTED_SOURCE_SHA" ) ]]; then
            echo '客户端构建仅允许 main 或指定源码 SHA 的 dev 调用' >&2
            exit 1
          fi
          if [[ "$RELEASE_REF" == refs/heads/dev && "$DISTRIBUTE" == true ]]; then
            echo 'dev 客户端仅用于测试，不允许 distribute=true' >&2
            exit 1
          fi
          case "$SELECTED_PLATFORM" in
            all|windows|android) ;;
            *) echo '客户端平台必须为 all、windows 或 android' >&2; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '源码 SHA 必须为完整的 40 位十六进制提交 SHA' >&2
            exit 1
          fi

  windows:
    needs: guard
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 系统环境测试共享 Windows 用户会话；用例内部的并发行为仍正常验证。
      RUST_TEST_THREADS: '1'
      BUILD_PROFILE: release
      RUST_CACHE_STAGE: ${{ github.workspace }}/temp/cache/rust/windows-release
      CARGO_TARGET_DIR: ${{ github.workspace }}/temp/build/desktop-ci/${{ github.run_id }}-${{ github.run_attempt }}
      PI_DESK_DESKTOP_WEB_DIST: ${{ github.workspace }}/temp/build/desktop-ci/${{ github.run_id }}-${{ github.run_attempt }}/web
      CLIENT_OUTPUT: ${{ github.workspace }}/temp/package/clients/windows/${{ github.run_id }}-${{ github.run_attempt }}
      PI_CODING_AGENT_DIR: ${{ github.workspace }}/temp/pi/desktop-ci/${{ github.run_id }}-${{ github.run_attempt }}/agent
      PI_CODING_AGENT_SESSION_DIR: ${{ github.workspace }}/temp/pi/desktop-ci/${{ github.run_id }}-${{ github.run_attempt }}/agent/sessions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: 核对版本并生成相对路径配置
        shell: pwsh
        run: |
          @'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs'
          import { relative, resolve } from 'node:path'
          const desktop = resolve('apps/desktop')
          const rust = resolve(desktop, 'src-tauri')
          const version = JSON.parse(readFileSync(resolve(desktop, 'package.json'), 'utf8')).version
          const tauri = JSON.parse(readFileSync(resolve(rust, 'tauri.conf.json'), 'utf8')).version
          const cargo = readFileSync(resolve(rust, 'Cargo.toml'), 'utf8')
            .match(/\[package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1]
          const lock = readFileSync(resolve(rust, 'Cargo.lock'), 'utf8').split('[[package]]')
            .find(block => /^name\s*=\s*"pi-desk-desktop"/m.test(block))
            ?.match(/^version\s*=\s*"([^"]+)"/m)?.[1]
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              [tauri, cargo, lock].some(value => value !== version)) {
            throw new Error('桌面 package.json、Tauri、Cargo.toml 和 Cargo.lock 版本不一致或不是正式版本')
          }
          mkdirSync(process.env.CARGO_TARGET_DIR, { recursive: true })
          const frontendDist = relative(rust, process.env.PI_DESK_DESKTOP_WEB_DIST).replaceAll('\\', '/')
          writeFileSync(resolve(process.env.CARGO_TARGET_DIR, 'tauri-ci.json'),
            JSON.stringify({ build: { frontendDist } }))
          console.log(`桌面版本核对通过：${version}`)
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装独立桌面依赖
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: 安装 Windows x86 Rust 目标
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          CARGO_TARGET_DIR: ${{ env.RUST_CACHE_STAGE }}
        with:
          key: windows-i686-${{ env.BUILD_PROFILE }}
          cache-bin: 'false'
          workspaces: apps/desktop/src-tauri -> ../../../temp/cache/rust/windows-${{ env.BUILD_PROFILE }}
      - run: node .github/scripts/rust-cache.mjs restore
      - name: 前端类型检查与资源准备
        working-directory: apps/desktop
        run: |
          pnpm run typecheck:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 受影响桌面 Rust 回归
        working-directory: apps/desktop
        run: |
          $env:TAURI_CONFIG = Get-Content "$env:CARGO_TARGET_DIR/tauri-ci.json" -Raw
          $monitor = Start-Job -ScriptBlock {
            $last = @{}
            while ($true) {
              Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -match 'Is64BitOperatingSystem|PiDeskPathTest-' } | ForEach-Object {
                $pidValue = $_.ProcessId
                $now = [DateTime]::UtcNow
                if (-not $last.ContainsKey($pidValue) -or ($now - $last[$pidValue]).TotalSeconds -ge 2) {
                  $process = Get-Process -Id $pidValue -ErrorAction SilentlyContinue
                  if ($process) {
                    @{ time=$now.ToString('o'); pid=$pidValue; parent=$_.ParentProcessId; image=$_.ExecutablePath; command=$_.CommandLine; cpu=$process.CPU; threads=@($process.Threads | ForEach-Object { @{ id=$_.Id; state=$_.ThreadState.ToString(); wait=$(try { $_.WaitReason.ToString() } catch { '' }) } }) } | ConvertTo-Json -Compress -Depth 4
                    $last[$pidValue] = $now
                  }
                }
              }
              Start-Sleep -Milliseconds 500
            }
          }
          try {
            cargo test --manifest-path src-tauri/Cargo.toml --target i686-pc-windows-msvc --release --locked
            $testExit = $LASTEXITCODE
          } finally {
            Stop-Job $monitor
            Receive-Job $monitor | Out-File "$env:CARGO_TARGET_DIR/windows-probes.jsonl" -Encoding utf8
            Remove-Job $monitor
          }
          if ($testExit -ne 0) { exit $testExit }
      - name: 保留 Windows 探针诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probes-${{ github.run_id }}
          overwrite: true
          path: ${{ env.CARGO_TARGET_DIR }}/windows-probes.jsonl
          retention-days: 7
          if-no-files-found: ignore
      - name: 构建 Windows x86 NSIS 安装包
        if: ${{ !inputs.check_only }}
        working-directory: apps/desktop
        run: |
          $buildArgs = @('exec', 'tauri', 'build', '--target', 'i686-pc-windows-msvc', '--bundles', 'nsis', '--config', "$env:CARGO_TARGET_DIR/tauri-ci.json")
          & pnpm @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 隔离验证覆盖安装与正常退出
        if: github.ref == 'refs/heads/main' && !inputs.check_only
        working-directory: apps/desktop
        run: |
          node scripts/test-installer-overwrite.mjs "$env:CARGO_TARGET_DIR/i686-pc-windows-msvc/release/nsis/x86/installer.nsi" "$env:CARGO_TARGET_DIR/.tauri/NSIS/makensis.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node .github/scripts/rust-cache.mjs save
      - name: 检查真实 PE 架构并归档
        if: ${{ !inputs.check_only }}
        shell: pwsh
        run: |
          $release = Join-Path $env:CARGO_TARGET_DIR "i686-pc-windows-msvc/$env:BUILD_PROFILE"
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $release 'pi-desk-desktop.exe'))
          if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d) {
            throw '桌面程序不是有效 PE 文件'
          }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 0 -or $offset + 6 -gt $bytes.Length -or
              [BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x14c) {
            throw '桌面程序不是 Windows x86 PE（machine=0x14c）'
          }
          $installers = @(Get-ChildItem (Join-Path $release 'bundle/nsis') -Filter '*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) {
            throw '必须生成一个非空 NSIS 安装包'
          }
          node .github/scripts/check-desktop-tunnel.mjs (Join-Path $release 'pi-desk-desktop.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/scripts/pack-client.mjs windows $installers[0].FullName $env:CLIENT_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.check_only }}
        with:
          name: client-windows-${{ github.run_id }}
          overwrite: true
          path: ${{ env.CLIENT_OUTPUT }}/
          retention-days: 7
          if-no-files-found: error

  android:
    needs: guard
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_BUILD_ROOT: ${{ github.workspace }}/temp/build/android-ci/${{ github.run_id }}-${{ github.run_attempt }}
      GRADLE_USER_HOME: ${{ github.workspace }}/temp/cache/gradle
      CLIENT_OUTPUT: ${{ github.workspace }}/temp/package/clients/android/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            temp/cache/gradle/caches/modules-2
            temp/cache/gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 构建、验证并归档 Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DISTRIBUTE: ${{ inputs.distribute }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/pi-desk-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'rm -rf "$signing_dir"' EXIT
          signing_count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then signing_count=$((signing_count + 1)); fi
          done
          if [[ "$signing_count" != 0 && "$signing_count" != 3 ]]; then
            echo 'Android 签名 Secrets 必须全部配置或全部缺失' >&2
            exit 1
          fi
          if [[ "$DISTRIBUTE" == true && "$signing_count" != 3 ]]; then
            echo '分发 Android APK 必须配置完整签名' >&2
            exit 1
          fi
          signing_args=()
          pack_args=()
          if [[ "$signing_count" == 3 ]]; then
            export SIGNING_DIR="$signing_dir"
            node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const directory = process.env.SIGNING_DIR
          mkdirSync(directory, { recursive: true, mode: 0o700 })
          const escape = value => Array.from(value, character => {
            if ('\\ =:#!'.includes(character)) return `\\${character}`
            const code = character.charCodeAt(0)
            if (code < 0x20 || code > 0x7e) {
              return character.split('').map(unit => `\\u${unit.charCodeAt(0).toString(16).padStart(4, '0')}`).join('')
            }
            return character
          }).join('')
          writeFileSync(join(directory, 'release.p12'), Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), { mode: 0o600 })
          writeFileSync(join(directory, 'release.properties'),
            `storePassword=${escape(process.env.ANDROID_STORE_PASSWORD)}\nkeyPassword=${escape(process.env.ANDROID_KEY_PASSWORD)}\n`, { mode: 0o600 })
          NODE
            signing_args=("-PpiDeskSigningProperties=$signing_dir/release.properties" "-PpiDeskSigningKeyStore=$signing_dir/release.p12")
          else
            pack_args=(--unsigned)
          fi
          mkdir -p "$ANDROID_BUILD_ROOT"
          cat > "$ANDROID_BUILD_ROOT/isolated-build.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              def name = project == project.rootProject ? 'root' : project.path.substring(1).replace(':', '/')
              project.layout.buildDirectory.set(new File(System.getenv('ANDROID_BUILD_ROOT'), name))
          }
          GRADLE
          chmod +x apps/android/gradlew
          build_tasks=(:app:testDebugUnitTest)
          if [[ "$CHECK_ONLY" != true ]]; then build_tasks+=(:app:assembleRelease); fi
          (
            cd apps/android
            ./gradlew --no-daemon --project-cache-dir "$ANDROID_BUILD_ROOT/project-cache" \
              --init-script "$ANDROID_BUILD_ROOT/isolated-build.gradle" \
              "${signing_args[@]}" "${build_tasks[@]}"
          )
          if [[ "$CHECK_ONLY" == true ]]; then
            echo 'Android 受影响检查通过，不生成安装包。'
            exit 0
          fi
          apk="$ANDROID_BUILD_ROOT/app/outputs/apk/release/app-release.apk"
          if [[ "$signing_count" == 0 ]]; then
            apk="$ANDROID_BUILD_ROOT/app/outputs/apk/release/app-release-unsigned.apk"
          else
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$ANDROID_BUILD_ROOT/badging.txt"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const source = readFileSync('apps/android/app/build.gradle.kts', 'utf8')
          const version = source.match(/^\s*versionName\s*=\s*"([^"]+)"/m)?.[1]
          const code = source.match(/^\s*versionCode\s*=\s*(\d+)/m)?.[1]
          const id = source.match(/^\s*applicationId\s*=\s*"([^"]+)"/m)?.[1]
          const badging = readFileSync(`${process.env.ANDROID_BUILD_ROOT}/badging.txt`, 'utf8')
          const actual = badging.match(/^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'/m)
          if (id !== 'com.jetcrab.android' || !actual || actual[1] !== id || actual[2] !== code || actual[3] !== version) {
            throw new Error('APK applicationId、versionName 或 versionCode 与源码不一致')
          }
          console.log(`Android APK 身份核对通过：${id} ${version} (${code})`)
          NODE
          node .github/scripts/pack-client.mjs android "$apk" "$CLIENT_OUTPUT" "${pack_args[@]}"
      - name: 清理签名文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/pi-desk-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.check_only }}
        with:
          name: client-android-${{ github.run_id }}
          overwrite: true
          path: ${{ env.CLIENT_OUTPUT }}/
          retention-days: 7
          if-no-files-found: error
