name: Release tunnel

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定构建源码提交（完整 SHA）
        type: string
        required: true
      phase:
        description: build 仅构建，publish 推送已验证制品，all 完整执行
        type: string
        default: all
      check_only:
        description: 仅执行 Rust 检查，不构建测试镜像
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-tunnel-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/jetcrab/pi-desk-tunnel
  PACKAGE_DIR: temp/package/tunnel/${{ github.run_id }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 核对构建渠道和固定源码 SHA
        env:
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_PHASE: ${{ inputs.phase || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main && !( "$WORKFLOW_REF" == refs/heads/dev && "$RELEASE_PHASE" == build ) ]]; then
            echo '::error::main 可构建发布，dev 仅允许验证测试制品'
            exit 1
          fi
          case "$RELEASE_PHASE" in
            build|publish|all) ;;
            *) echo '::error::隧道阶段无效'; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::源码 SHA 必须为完整的 40 位十六进制提交 SHA'
            exit 1
          fi

  plan:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.selection.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 读取服务端版本
        id: version
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('apps/tunnel/server/Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), '隧道必须使用正式语义版本'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: 检测服务版本变化
        id: selection
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$REQUESTED_SOURCE_SHA" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/release-versions.mjs tunnel
          fi

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && inputs.phase != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_VERSION: ${{ needs.plan.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/temp/build/tunnel-ci/${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: pi-desk-tunnel-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Rust workspace 测试
        working-directory: apps/tunnel
        run: |
          cargo --version
          cargo test --workspace --locked

      - name: Set up Docker Buildx
        if: ${{ !inputs.check_only }}
        uses: docker/setup-buildx-action@v3

      - name: 构建并加载 linux/amd64 镜像
        if: ${{ !inputs.check_only }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: apps/tunnel
          file: apps/tunnel/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha || github.sha }}

      - name: 容器 HTTP 健康探针
        if: ${{ !inputs.check_only }}
        run: |
          export PI_DESK_TUNNEL_SERVER_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export PI_DESK_TUNNEL_PRIVATE_KEY="$(python3 -c 'import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          echo "::add-mask::$PI_DESK_TUNNEL_SERVER_KEY"
          echo "::add-mask::$PI_DESK_TUNNEL_PRIVATE_KEY"
          docker run --detach --name "$CONTAINER_NAME" --pull=never \
            --log-opt max-size=10m --log-opt max-file=2 \
            --publish 127.0.0.1::7001 \
            --env PI_DESK_TUNNEL_SERVER_KEY --env PI_DESK_TUNNEL_PRIVATE_KEY \
            "$IMAGE_REPOSITORY:$IMAGE_VERSION"
          address="$(docker port "$CONTAINER_NAME" 7001/tcp)"
          HEALTH_URL="http://$address/api/v1/system/health" python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 30
          while True:
              try:
                  with urllib.request.urlopen(os.environ["HEALTH_URL"], timeout=2) as response:
                      if response.status != 200 or json.load(response) != {"status": "ok"}:
                          raise SystemExit("健康接口未返回预期的 HTTP 200 与 status=ok")
                  print("容器 HTTP 健康探针通过")
                  break
              except urllib.error.URLError as error:
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"容器 HTTP 健康探针失败：{error}") from error
                  time.sleep(1)
          PY

      - name: 保存已验证镜像
        if: ${{ !inputs.check_only }}
        run: |
          mkdir -p "$PACKAGE_DIR"
          docker save "$IMAGE_REPOSITORY:$IMAGE_VERSION" \
            | gzip > "$PACKAGE_DIR/pi-desk-tunnel-$IMAGE_VERSION-linux-amd64.tar.gz"

      - name: 上传压缩镜像
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-image-${{ github.run_id }}
          overwrite: true
          path: ${{ env.PACKAGE_DIR }}/pi-desk-tunnel-${{ needs.plan.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: 失败时输出容器日志
        if: failure()
        run: |
          if docker container inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
            docker logs "$CONTAINER_NAME"
          fi

      - name: 清理探针容器
        if: always()
        run: |
          if docker container inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
            docker rm --force "$CONTAINER_NAME"
          fi

  publish:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && !inputs.check_only && needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
      ((inputs.source_sha && inputs.phase == 'publish') ||
       (inputs.phase != 'build' && inputs.source_sha && needs.build.result == 'success'))
    needs: [plan, build]
    concurrency:
      group: release-tunnel-version-push
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: 下载已验证镜像
        uses: actions/download-artifact@v4
        with:
          name: tunnel-image-${{ github.run_id }}
          path: ${{ env.PACKAGE_DIR }}

      - name: 加载同一镜像并核对源码
        run: |
          set -euo pipefail
          gzip --decompress --stdout "$PACKAGE_DIR/pi-desk-tunnel-$IMAGE_VERSION-linux-amd64.tar.gz" | docker load
          revision=$(docker image inspect "$IMAGE_REPOSITORY:$IMAGE_VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [[ "$revision" != "$SOURCE_SHA" ]]; then
            echo '::error::已验证镜像的 revision 与本批源码 SHA 不匹配'
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查已有版本并核对可复用镜像
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_digest=''
          if gh api --paginate 'users/JetCrab/packages/container/pi-desk-tunnel/versions?per_page=100' \
            --jq '.[] | {name, tags: .metadata.container.tags}' > "$RUNNER_TEMP/tunnel-versions" 2> "$RUNNER_TEMP/tunnel-versions-error"; then
            remote_digest=$(jq -sr --arg version "$IMAGE_VERSION" '
              [.[] | select(.tags | index($version)) | .name] |
              if length > 1 then error("同一版本标签对应多个镜像摘要")
              elif length == 0 then ""
              else .[0] | if type == "string" and length > 0 then . else error("已有版本记录缺少镜像摘要") end
              end
            ' "$RUNNER_TEMP/tunnel-versions")
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tunnel-versions-error"; then
            echo '::error::无法确认镜像版本状态，停止发布'
            exit 1
          fi
          reused=false
          if [[ -n "$remote_digest" ]]; then
            if [[ -z "$REQUESTED_SOURCE_SHA" ]]; then
              echo "::error::镜像版本已存在，拒绝覆盖：$IMAGE_VERSION"
              exit 1
            fi
            if [[ ! "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::GHCR 版本记录未提供有效的镜像摘要，拒绝复用'
              exit 1
            fi
            docker pull --platform linux/amd64 "$IMAGE_REPOSITORY:$IMAGE_VERSION"
            if ! docker image inspect "$IMAGE_REPOSITORY:$IMAGE_VERSION" --format '{{json .RepoDigests}}' \
              | jq -e --arg expected "$IMAGE_REPOSITORY@$remote_digest" 'index($expected) != null' > /dev/null; then
              echo '::error::远端版本镜像摘要与 GHCR 版本记录不匹配，拒绝复用'
              exit 1
            fi
            revision=$(docker image inspect "$IMAGE_REPOSITORY@$remote_digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [[ "$revision" != "$SOURCE_SHA" ]]; then
              echo '::error::远端版本镜像的 revision 与本批源码 SHA 不匹配，拒绝复用'
              exit 1
            fi
            docker tag "$IMAGE_REPOSITORY@$remote_digest" "$IMAGE_REPOSITORY:latest"
            reused=true
            echo "已核对远端版本镜像，将复用 $IMAGE_VERSION 并更新 latest。"
          else
            docker tag "$IMAGE_REPOSITORY:$IMAGE_VERSION" "$IMAGE_REPOSITORY:latest"
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: 推送已验证镜像
        env:
          REUSED: ${{ steps.existing.outputs.reused }}
        run: |
          set -euo pipefail
          if [[ "$REUSED" != true ]]; then
            docker push "$IMAGE_REPOSITORY:$IMAGE_VERSION"
          fi
          docker push "$IMAGE_REPOSITORY:latest"
