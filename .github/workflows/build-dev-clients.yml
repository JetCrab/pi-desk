name: Build dev clients

on:
  push:
    branches: [dev]
    paths:
      - 'apps/desktop/**'
      - 'apps/android/**'
      - 'apps/tunnel/**'
      - 'src/common/**'
      - '.github/scripts/pack-client.mjs'
      - '.github/scripts/check-desktop-tunnel.mjs'
      - '.github/scripts/apple-signing.sh'
      - '.github/workflows/build-clients.yml'
      - '.github/workflows/release-apple.yml'
      - '.github/workflows/build-dev-clients.yml'

permissions:
  contents: read

concurrency:
  group: build-dev-clients
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.select.outputs.windows }}
      macos: ${{ steps.select.outputs.macos }}
      android: ${{ steps.select.outputs.android }}
      clients_platform: ${{ steps.select.outputs.clients_platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 按推送前后的文件变化选择平台
        id: select
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ||
                ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '推送前后 SHA 必须为完整的 40 位十六进制提交 SHA' >&2
            exit 1
          fi
          windows=false
          macos=false
          android=false
          if [[ "$CREATED" == true || "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            windows=true
            macos=true
            android=true
          else
            # 强推后的 before 提交可能不在当前分支历史中。
            if ! git cat-file -e "$BEFORE_SHA^{commit}"; then
              authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
              git -c http.extraheader="AUTHORIZATION: basic $authorization" fetch --no-tags origin "$BEFORE_SHA"
            fi
            changed_files="$RUNNER_TEMP/pi-desk-dev-changes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            trap 'rm -f "$changed_files"' EXIT
            git diff --name-only --no-renames -z "$BEFORE_SHA" "$SOURCE_SHA" > "$changed_files"
            while IFS= read -r -d '' path; do
              case "$path" in
                apps/desktop/*|apps/tunnel/*)
                  windows=true
                  macos=true
                  ;;
                apps/android/*)
                  android=true
                  ;;
                src/common/*|.github/scripts/pack-client.mjs|.github/workflows/build-dev-clients.yml)
                  windows=true
                  macos=true
                  android=true
                  ;;
                .github/workflows/build-clients.yml)
                  windows=true
                  android=true
                  ;;
                .github/scripts/check-desktop-tunnel.mjs)
                  windows=true
                  ;;
                .github/scripts/apple-signing.sh|.github/workflows/release-apple.yml)
                  macos=true
                  ;;
              esac
            done < "$changed_files"
          fi
          clients_platform=''
          if [[ "$windows" == true && "$android" == true ]]; then
            clients_platform=all
          elif [[ "$windows" == true ]]; then
            clients_platform=windows
          elif [[ "$android" == true ]]; then
            clients_platform=android
          fi
          {
            echo "windows=$windows"
            echo "macos=$macos"
            echo "android=$android"
            echo "clients_platform=$clients_platform"
          } >> "$GITHUB_OUTPUT"
          echo "开发客户端构建平台：Windows=$windows，macOS=$macos，Android=$android"

  clients:
    needs: changes
    if: needs.changes.outputs.clients_platform != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-clients.yml
    with:
      source_sha: ${{ github.sha }}
      platform: ${{ needs.changes.outputs.clients_platform }}
      distribute: false

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-apple.yml
    with:
      source_sha: ${{ github.sha }}
      platform: macos
