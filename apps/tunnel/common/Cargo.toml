[package]
name = "pi-desk-tunnel-common"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Pi Desk iroh TCP tunnel runtime and encrypted control protocol"

[dependencies]
futures-util = "0.3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper", "metrics"] }
chacha20poly1305 = "0.11"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
ureq = { version = "3", default-features = false }
url = "2"

[dev-dependencies]
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "test-utils", "tls-ring"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
