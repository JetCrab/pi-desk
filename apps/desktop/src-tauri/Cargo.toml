[package]
name = "pi-desk-desktop"
version = "1.1.37"
description = "Pi Desk native desktop shell"
authors = ["JetCrab"]
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri = { version = "~2.11.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon", "x11", "dbus"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "=2.3.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
pi-desk-tunnel-common = { path = "../../tunnel/common" }
url = "2"
webbrowser = { version = "1.2.3", features = ["hardened"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
rfd = "0.15"
fs2 = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKContentWorld", "WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandlerWithReply", "WKUserContentController"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry"] }
