name: Release tunnel

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定构建源码提交（完整 SHA）
        type: string
        required: true
      phase:
        description: build 仅构建，publish 推送已验证制品，all 完整执行
        type: string
        default: all
      check_only:
        description: 仅执行 Rust 检查，不构建测试镜像
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-tunnel-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/jetcrab/pi-desk-tunnel
  PACKAGE_DIR: temp/package/tunnel/${{ github.run_id }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 核对构建渠道和固定源码 SHA
        env:
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_PHASE: ${{ inputs.phase || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main && !( "$WORKFLOW_REF" == refs/heads/dev && "$RELEASE_PHASE" == build ) ]]; then
            echo '::error::main 可构建发布，dev 仅允许验证测试制品'
            exit 1
          fi
          case "$RELEASE_PHASE" in
            build|publish|all) ;;
            *) echo '::error::隧道阶段无效'; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::源码 SHA 必须为完整的 40 位十六进制提交 SHA'
            exit 1
          fi

  plan:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.selection.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: 读取服务端版本
        id: version
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('apps/tunnel/server/Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), '隧道必须使用正式语义版本'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: 使用调用方已确认的构建范围
        id: selection
        run: echo 'changed=true' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && inputs.phase != 'publish'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE_ARCH: ${{ matrix.arch }}
      IMAGE_VERSION: ${{ needs.plan.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/temp/build/tunnel-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      CONTAINER_NAME: pi-desk-tunnel-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust workspace 测试
        working-directory: apps/tunnel
        run: |
          cargo --version
          cargo test --workspace --locked

      - name: 容器入口密钥与进程回收测试
        run: |
          if [[ -f apps/tunnel/docker-start.sh ]]; then
            bash -n apps/tunnel/docker-start.sh
            python3 -B -m unittest discover -s apps/tunnel/deploy -p 'test_docker_start.py' -v
          fi

      - name: Set up Docker Buildx
        if: ${{ !inputs.check_only }}
        uses: docker/setup-buildx-action@v3

      - name: 构建并加载当前架构镜像
        if: ${{ !inputs.check_only }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: apps/tunnel
          file: apps/tunnel/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.plan.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha || github.sha }}

      - name: 验证镜像公网入口、原生映射和强制中继
        if: ${{ !inputs.check_only }}
        run: |
          cargo build --locked --manifest-path apps/tunnel/Cargo.toml -p pi-desk-tunnel-server --example test-transport-smoke
          node .github/scripts/check-tunnel-image.mjs \
            "$IMAGE_REPOSITORY:$IMAGE_VERSION-$IMAGE_ARCH" \
            "$CARGO_TARGET_DIR/debug/examples/test-transport-smoke"

      - name: 保存已验证镜像
        if: ${{ !inputs.check_only }}
        run: |
          mkdir -p "$PACKAGE_DIR"
          docker save "$IMAGE_REPOSITORY:$IMAGE_VERSION-$IMAGE_ARCH" \
            | gzip > "$PACKAGE_DIR/pi-desk-tunnel-$IMAGE_VERSION-linux-$IMAGE_ARCH.tar.gz"

      - name: 上传压缩镜像
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-image-${{ github.run_id }}-${{ matrix.arch }}
          overwrite: true
          path: ${{ env.PACKAGE_DIR }}/pi-desk-tunnel-${{ needs.plan.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: 保留数据链验收失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-smoke-failure-${{ github.run_id }}-${{ matrix.arch }}
          overwrite: true
          path: temp/run/tunnel-image/
          if-no-files-found: ignore
          retention-days: 7

      - name: 清理验收容器
        if: always()
        run: |
          name="$CONTAINER_NAME-gateway"
          if docker container inspect "$name" > /dev/null 2>&1; then
            docker rm --force "$name"
          fi
          volume="$CONTAINER_NAME-data"
          if docker volume inspect "$volume" > /dev/null 2>&1; then
            docker volume rm "$volume"
          fi

  publish:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && !inputs.check_only && needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
      ((inputs.source_sha && inputs.phase == 'publish') ||
       (inputs.phase != 'build' && inputs.source_sha && needs.build.result == 'success'))
    needs: [plan, build]
    concurrency:
      group: release-tunnel-version-push
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - uses: docker/setup-buildx-action@v3

      - name: 下载两个架构的已验证镜像
        uses: actions/download-artifact@v4
        with:
          pattern: tunnel-image-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ env.PACKAGE_DIR }}

      - name: 加载两个已验证制品
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gzip --decompress --stdout "$PACKAGE_DIR/pi-desk-tunnel-$IMAGE_VERSION-linux-$arch.tar.gz" | docker load
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 核对固定版本并发布多架构镜像
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-tunnel.mjs
