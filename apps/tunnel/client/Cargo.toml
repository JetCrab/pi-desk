[package]
name = "pi-desk-tunnel-client"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless Pi Desk Noise TCP tunnel client"

[dependencies]
pi-desk-tunnel-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
pi-desk-tunnel-server = { path = "../server" }
tokio = { version = "1", features = ["full", "process"] }
