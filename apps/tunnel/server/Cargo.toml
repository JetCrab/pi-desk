[package]
name = "pi-desk-tunnel-server"
version = "1.2.3"
edition = "2024"
license = "Apache-2.0"
description = "Pi Desk lightweight TCP tunnel control server"

[dependencies]
anyhow = "1"
axum = "0.8"
getrandom = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
pi-desk-tunnel-common = { path = "../common" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
