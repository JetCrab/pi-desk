name: Source checks

on:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      base_sha:
        type: string
        default: ''
      built_packages:
        type: string
        default: '[]'

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      web: ${{ steps.select.outputs.web }}
      pidesk: ${{ steps.select.outputs.pidesk }}
      website: ${{ steps.select.outputs.website }}
      agent: ${{ steps.select.outputs.agent }}
      automation: ${{ steps.select.outputs.automation }}
      plugins: ${{ steps.select.outputs.plugins }}
      files: ${{ steps.select.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - id: select
        env:
          CHECK_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ inputs.source_sha || github.sha }}
          CHECK_BUILT_PACKAGES: ${{ inputs.built_packages || '[]' }}
        run: node .github/scripts/select-ci-checks.mjs
      - name: 核对代码提交的版本同步
        env:
          CHECK_BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ inputs.source_sha || github.sha }}
        run: |
          if [[ -n "$CHECK_BASE" && "$CHECK_BASE" != 0000000000000000000000000000000000000000 ]]; then
            node .github/scripts/commit-versions.mjs check "$CHECK_BASE" "$CHECK_HEAD"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.automation == 'true' || (needs.changes.outputs.full != 'true' && needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.automation == 'true'
        with:
          version: 10.15.0
          run_install: false
      - name: 安装发布检查工具
        if: needs.changes.outputs.automation == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: 校验所有工作流语法、调用参数与权限
        if: needs.changes.outputs.automation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/temp/cache/actionlint"
          mkdir -p "$tools"
          gh release download v1.7.7 --repo rhysd/actionlint --pattern actionlint_1.7.7_linux_amd64.tar.gz --pattern actionlint_1.7.7_checksums.txt --dir "$tools"
          (cd "$tools" && sha256sum --check --ignore-missing actionlint_1.7.7_checksums.txt && tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint)
          "$tools/actionlint" -shellcheck= -pyflakes=
          node .github/scripts/check-workflows.mjs
      - name: PR 检查实际变动的发布脚本
        if: github.event_name == 'pull_request' && needs.changes.outputs.automation == 'true'
        env:
          CHECK_FILES_JSON: ${{ needs.changes.outputs.files }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { existsSync } from 'node:fs'
          const files = JSON.parse(process.env.CHECK_FILES_JSON).filter(file => /\.github\/.*\.(?:js|mjs)$/.test(file) && existsSync(file))
          if (files.length) execFileSync('pnpm', ['exec', 'eslint', '--no-ignore', ...files], { stdio: 'inherit' })
          NODE
      - name: 源码公开边界
        run: node --test tests/l4-public-boundary.test.mjs
      - name: 发布流程核心回归
        if: needs.changes.outputs.automation == 'true'
        run: >-
          node --test
          tests/l4-commit-versions.test.mjs
          tests/l4-npm-channel.test.mjs
          tests/l4-development-suffix.test.mjs
          tests/l4-dev-artifact-sources.test.mjs
          tests/l4-release-dev-reuse.test.mjs
          tests/l4-release-dev-state.test.mjs
          tests/l4-release-dev-plan.test.mjs
          tests/l4-workflow-contracts.test.mjs
          tests/l4-restore-sdk.test.mjs
          tests/l4-release-main.test.mjs
          tests/l4-restore-release-artifacts.test.mjs
          tests/l4-release-website.test.mjs
          tests/l4-release-npm.test.mjs
          tests/l4-release-speed.test.mjs
          tests/l4-release-dev.test.mjs
          tests/l4-release-parallel.test.mjs
          tests/l4-release-queue.test.mjs
          tests/l4-release-docker.test.mjs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/tsconfig.json
      PI_CODING_AGENT_DIR: ${{ github.workspace }}/temp/pi/ci-web/web-checks-${{ github.run_id }}-${{ github.run_attempt }}/agent
      PI_CODING_AGENT_SESSION_DIR: ${{ github.workspace }}/temp/pi/ci-web/web-checks-${{ github.run_id }}-${{ github.run_attempt }}/agent/sessions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install public workspace dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Prepare SDK Host Runtime
        run: pnpm build:plugin-host-runtime
      - name: Check production types and dependency layers not covered by packaging
        if: "!contains(fromJSON(inputs.built_packages || '[]'), 'pi-desk')"
        run: pnpm typecheck && pnpm check:layers
      - name: PR lint changed source files
        if: github.event_name == 'pull_request'
        env:
          CHECK_FILES_JSON: ${{ needs.changes.outputs.files }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { existsSync } from 'node:fs'
          const files = JSON.parse(process.env.CHECK_FILES_JSON).filter(file => /^(?:src|bin)\/.*\.(?:ts|tsx|js|mjs)$/.test(file) && existsSync(file))
          if (files.length) execFileSync('pnpm', ['exec', 'eslint', ...files], { stdio: 'inherit' })
          NODE
      - name: Run local protocol and state regressions
        run: >-
          node --import tsx --test
          tests/l4-api-request.test.ts
          tests/l4-public-boundary.test.mjs
          tests/l2-chat-state.test.ts
          tests/l2-task-center-state.test.ts
          tests/l2-work-session-update.test.ts
          tests/l2-workbench-layout.test.ts
          tests/l3-app-runtime-state.test.ts
          tests/l3-project-file-tree.test.ts

  pidesk:
    needs: changes
    if: needs.changes.outputs.pidesk == 'true' && !contains(fromJSON(inputs.built_packages || '[]'), 'pi-desk')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/tsconfig.json
      PI_DESK_PI_PACKAGE_DIR: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
      PI_CODING_AGENT_DIR: ${{ github.workspace }}/temp/pi/ci-pidesk/commands-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}/agent
      PI_CODING_AGENT_SESSION_DIR: ${{ github.workspace }}/temp/pi/ci-pidesk/commands-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}/agent/sessions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: 核对并固定 Windows Git Bash
        if: runner.os == 'Windows'
        run: |
          $original = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          Write-Host "原 Bash 路径：$original"
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
          $gitBin = Join-Path $gitRoot 'bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path $bash)) { throw 'Git for Windows 未提供 Bash' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$gitBin;$env:PATH"
          Write-Host "测试 Bash 路径：$((Get-Command bash.exe).Source)"
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bash -c 'node -p process.platform'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装公开依赖
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: 准备 SDK Host Runtime
        run: pnpm build:plugin-host-runtime
      - name: 宿主命令核心回归
        run: pnpm test:pidesk
      - name: 真实宿主命令链验收
        run: node --test tests/l1-pidesk.e2e.mjs
      - name: 保留命令验收失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pidesk-failure-${{ matrix.os }}-${{ github.run_id }}
          overwrite: true
          path: |
            temp/run/pidesk*/
            temp/pi/l1-pidesk/
          if-no-files-found: ignore
          retention-days: 7

  plugins:
    needs: changes
    if: needs.changes.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: 检查受影响且未由打包任务覆盖的插件
        env:
          CHECK_PLUGINS_JSON: ${{ needs.changes.outputs.plugins }}
          CHECK_BUILT_PACKAGES: ${{ inputs.built_packages || '[]' }}
        run: node .github/scripts/check-selected-plugins.mjs

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: apps/website
      - run: pnpm typecheck
        working-directory: apps/website
      - run: pnpm check:layers
        working-directory: apps/website
      - run: pnpm lint
        if: github.event_name == 'pull_request'
        working-directory: apps/website

  release-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: .github/release-agent/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: .github/release-agent
      - run: node --test tests/l4-release-agent.test.mjs
