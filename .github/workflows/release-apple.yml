name: Build Apple clients

on:
  workflow_call:
    inputs:
      source_sha:
        description: 固定构建源码提交（完整 SHA）
        type: string
        required: true
      platform:
        description: 构建平台（all/macos/ios）
        type: string
        default: macos
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: release-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 核对分支、平台和源码 SHA
        env:
          REF: ${{ github.ref }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/heads/main &&
                ( "$REF" != refs/heads/dev || -z "$REQUESTED_SOURCE_SHA" ) ]]; then
            echo 'Apple 构建仅允许 main 或指定源码 SHA 的 dev 调用' >&2
            exit 1
          fi
          case "$SELECTED_PLATFORM" in
            all|macos|ios) ;;
            *) echo 'Apple 平台必须为 all、macos 或 ios' >&2; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '源码 SHA 必须为完整的 40 位十六进制提交 SHA' >&2
            exit 1
          fi

  macos:
    needs: guard
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-14
    timeout-minutes: 70
    env:
      BUILD_PROFILE: release
      RUST_CACHE_STAGE: ${{ github.workspace }}/temp/cache/rust/macos-release
      CARGO_TARGET_DIR: ${{ github.workspace }}/temp/build/macos-ci/${{ github.run_id }}-${{ github.run_attempt }}/target
      PI_DESK_DESKTOP_WEB_DIST: ${{ github.workspace }}/temp/build/macos-ci/${{ github.run_id }}-${{ github.run_attempt }}/web
      CLIENT_OUTPUT: ${{ github.workspace }}/temp/package/clients/macos/${{ github.run_id }}-${{ github.run_attempt }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: 准备 Apple Silicon 和 Intel 编译目标
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          CARGO_TARGET_DIR: ${{ env.RUST_CACHE_STAGE }}
        with:
          key: macos-universal-${{ env.BUILD_PROFILE }}
          cache-bin: 'false'
          workspaces: apps/desktop/src-tauri -> ../../../temp/cache/rust/macos-${{ env.BUILD_PROFILE }}
      - run: node .github/scripts/rust-cache.mjs restore
      - name: 安装桌面依赖
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: 准备可选 Developer ID 签名
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/apple-signing.sh macos prepare
      - name: 核对版本并配置隔离产物目录
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs'
          import { relative, resolve } from 'node:path'
          const root = resolve('apps/desktop/src-tauri')
          const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version
          assert.match(version, /^\d+\.\d+\.\d+$/)
          assert.equal(JSON.parse(readFileSync(`${root}/tauri.conf.json`, 'utf8')).version, version)
          assert.equal(readFileSync(`${root}/Cargo.toml`, 'utf8').match(/^version = "([^"]+)"/m)?.[1], version)
          mkdirSync(process.env.CARGO_TARGET_DIR, { recursive: true })
          writeFileSync(`${process.env.CARGO_TARGET_DIR}/tauri-ci.json`, JSON.stringify({
            build: { frontendDist: relative(root, process.env.PI_DESK_DESKTOP_WEB_DIST) },
            bundle: { macOS: { minimumSystemVersion: '11.0', signingIdentity: process.env.APPLE_SIGNING_IDENTITY, hardenedRuntime: process.env.APPLE_SIGNING_IDENTITY !== '-' } }
          }))
          JS
      - name: 前端类型检查
        working-directory: apps/desktop
        run: pnpm run typecheck:web
      - name: 验证隔离桌面交互与隧道界面
        working-directory: apps/desktop
        run: pnpm run test:webkit --screenshots
      - name: 保存界面检查附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-webkit-checks-${{ github.run_id }}
          overwrite: true
          path: temp/run/desktop-webkit-confirm/
          if-no-files-found: ignore
          retention-days: 7
      - name: 构建通用 macOS 拖拽安装 DMG
        working-directory: apps/desktop
        env:
          # Tauri 在 CI 中默认跳过 Finder 布局，必须显式启用。
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          build_args=(exec tauri build --target universal-apple-darwin --bundles dmg --config "$CARGO_TARGET_DIR/tauri-ci.json")
          pnpm "${build_args[@]}"
      - name: 验证 macOS 托管进程退出与端口释放
        run: |
          export TAURI_CONFIG="$(node -p 'require("node:fs").readFileSync(process.env.CARGO_TARGET_DIR + "/tauri-ci.json", "utf8")')"
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml process:: -- --test-threads=1
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml service_port:: -- --test-threads=1
          cargo test --locked --manifest-path apps/tunnel/Cargo.toml --workspace -- --test-threads=1
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml tunnel -- --test-threads=1
      - run: node .github/scripts/rust-cache.mjs save
      - name: 检查 DMG 拖拽布局、双架构与签名并归档
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          release="$CARGO_TARGET_DIR/universal-apple-darwin/$BUILD_PROFILE"
          dmgs=("$release/bundle/dmg/"*.dmg)
          test "${#dmgs[@]}" = 1
          test -s "${dmgs[0]}"
          mountpoint="$RUNNER_TEMP/pi-desk-dmg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$mountpoint"
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          cleanup() {
            exit_status=$?
            trap - EXIT
            if ! hdiutil detach "$mountpoint" > /dev/null; then
              echo '卸载 DMG 失败' >&2
              if [[ "$exit_status" == 0 ]]; then
                exit_status=1
              fi
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT
          app="$mountpoint/Pi Desk.app"
          test -d "$app"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          test -s "$mountpoint/.DS_Store"
          cmp apps/desktop/src-tauri/dmg-background.png "$mountpoint/.background/dmg-background.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.jetcrab.desktop"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          node .github/scripts/check-desktop-tunnel.mjs "$app/Contents/MacOS/$executable"
          PI_DESK_TUNNEL_TEST_DESKTOP_EXECUTABLE="$app/Contents/MacOS/$executable" \
            cargo test --locked --manifest-path apps/tunnel/Cargo.toml -p pi-desk-tunnel-client --test cli -- --test-threads=1
          version=$(node -p 'require("./apps/desktop/package.json").version')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          suffix=adhoc
          pack_args=(macos "${dmgs[0]}" "$CLIENT_OUTPUT")
          if [[ "$SIGNED" == true ]]; then
            suffix=developer-id
            pack_args+=(--developer-id)
          fi
          node .github/scripts/pack-client.mjs "${pack_args[@]}"
          (cd "$CLIENT_OUTPUT" && shasum -a 256 ./*.dmg > SHA256SUMS.txt)
          {
            echo '## macOS 构建结果'
            echo "- 版本：${version}；架构：Apple Silicon + Intel"
            echo "- 签名类型：${suffix}，未进行 Apple 公证。"
            echo '- 打开 DMG，将 Pi Desk.app 拖入 Applications；覆盖前先停止服务并退出应用。首次打开可能需要在隐私与安全性中选择“仍要打开”。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时签名
        if: always()
        run: bash .github/scripts/apple-signing.sh macos cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ github.run_id }}
          overwrite: true
          path: ${{ env.CLIENT_OUTPUT }}/
          retention-days: 7
          if-no-files-found: error

  ios:
    needs: guard
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 准备 XcodeGen
        run: |
          if ! command -v xcodegen > /dev/null; then brew install xcodegen; fi
          xcodebuild -version
      - name: 准备可选 iOS 签名
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: bash .github/scripts/apple-signing.sh ios prepare
      - name: 构建模拟器与设备归档
        env:
          APPLE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: bash .github/scripts/build-ios.sh
      - name: 清理临时签名
        if: always()
        run: bash .github/scripts/apple-signing.sh ios cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios-${{ github.run_id }}
          overwrite: true
          path: temp/package/clients/ios/${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
