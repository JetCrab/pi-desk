name: Release clients

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        options: [all, windows, android]
        default: all
      publish:
        description: 上传 GitHub Release
        type: boolean
        default: false
      upload_server:
        description: 上传已有下载站
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-clients
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 核对分支、平台和源码 SHA
        env:
          RELEASE_REF: ${{ github.ref }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo '客户端发布工作流仅允许 main 分支' >&2
            exit 1
          fi
          case "$SELECTED_PLATFORM" in
            all|windows|android) ;;
            *) echo '客户端平台必须为 all、windows 或 android' >&2; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '源码 SHA 必须为完整的 40 位十六进制提交 SHA' >&2
            exit 1
          fi

  callbuild:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-clients.yml
    with:
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
      distribute: ${{ inputs.publish || inputs.upload_server }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: [guard, callbuild]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      inputs.publish && needs.guard.result == 'success' && needs.callbuild.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      SELECTED_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.platform != 'android'
        with:
          name: client-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/package/clients/windows/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: inputs.platform != 'windows'
        with:
          name: client-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/package/clients/android/${{ github.run_id }}-${{ github.run_attempt }}
      - name: 发布平台专属 Release
        shell: bash
        run: |
          set -euo pipefail
          platforms=(windows android)
          if [[ "$SELECTED_PLATFORM" != all ]]; then platforms=("$SELECTED_PLATFORM"); fi
          for platform in "${platforms[@]}"; do
            directory="temp/package/clients/$platform/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if find "$directory" -name '*-unsigned.apk' | grep -q .; then
              echo '拒绝发布未签名 APK' >&2
              exit 1
            fi
            version=$(jq -er '.version' "$directory/release.json")
            prefix=desktop
            if [[ "$platform" == android ]]; then prefix=android; fi
            tag="$prefix-v$version"
            # 先核对全部目标，避免已有版本导致一半平台发布后才失败。
            releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
            if grep -Fxq "$tag" <<< "$releases"; then
              echo "Release 已存在，拒绝覆盖：$tag" >&2
              exit 1
            fi
            refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
            if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
              commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')
              if [[ "$commit" != "$RELEASE_SHA" ]]; then
                echo "已有 tag 指向其他提交，拒绝发布：$tag" >&2
                exit 1
              fi
            fi
          done
          for platform in "${platforms[@]}"; do
            directory="temp/package/clients/$platform/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            version=$(jq -er '.version' "$directory/release.json")
            prefix=desktop
            if [[ "$platform" == android ]]; then prefix=android; fi
            mv "$directory/release.json" "$directory/$platform-release.json"
            gh release create "$prefix-v$version" "$directory"/* --target "$RELEASE_SHA" --title "Pi Desk $platform $version" --notes "由 GitHub Actions 构建，源码提交 $RELEASE_SHA。"
          done

  server:
    needs: [guard, callbuild, publish]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' &&
      inputs.upload_server && needs.guard.result == 'success' && needs.callbuild.result == 'success' &&
      (!inputs.publish || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIENT_SSH_HOST: ${{ secrets.CLIENT_SSH_HOST }}
      CLIENT_SSH_USER: ${{ secrets.CLIENT_SSH_USER }}
      CLIENT_SSH_PORT: ${{ vars.CLIENT_SSH_PORT || '22' }}
      CLIENT_SSH_PRIVATE_KEY: ${{ secrets.CLIENT_SSH_PRIVATE_KEY }}
      CLIENT_SSH_PASSWORD: ${{ secrets.CLIENT_SSH_PASSWORD }}
      CLIENT_SSH_KNOWN_HOSTS: ${{ secrets.CLIENT_SSH_KNOWN_HOSTS }}
      CLIENT_UPLOAD_ROOT: ${{ secrets.CLIENT_UPLOAD_ROOT }}
      CLIENT_DOWNLOAD_BASE_URL: ${{ secrets.CLIENT_DOWNLOAD_BASE_URL }}
      SELECTED_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@v4
        if: inputs.platform != 'android'
        with:
          name: client-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/package/clients/windows/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: inputs.platform != 'windows'
        with:
          name: client-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: temp/package/clients/android/${{ github.run_id }}-${{ github.run_attempt }}
      - name: 上传已有下载站
        shell: bash
        run: |
          set -euo pipefail
          platforms=(windows android)
          if [[ "$SELECTED_PLATFORM" != all ]]; then platforms=("$SELECTED_PLATFORM"); fi
          for platform in "${platforms[@]}"; do
            directory="temp/package/clients/$platform/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if find "$directory" -name '*-unsigned.apk' | grep -q .; then
              echo '拒绝上传未签名 APK' >&2
              exit 1
            fi
            node .github/scripts/upload-client.mjs "$platform" "$directory"
          done
